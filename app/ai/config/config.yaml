# config.yaml
#
# Environment-specific values should be overridden by:
#   config.dev.yaml
#   config.prod.yaml
#
# Secrets should NEVER live here.
# Use environment variables / a secret manager.

version: 1

app:
  name: "urban-intelligence-agent"
  environment: "dev"          # dev | staging | prod
  version: "0.1.0"

# -------------------------------------------------------------------
# MODEL
# -------------------------------------------------------------------

model:
  provider: "ollama"           # openai | ollama | mock

  # Keep the actual model configurable.
  name: "qwen2.5:7b"

  # Generation
  temperature: 0.0
  top_p: 1.0
  max_output_tokens: 4096

  # Reasoning-capable models
  reasoning:
    enabled: true
    effort: "high"           # low | medium | high

  # Request behavior
  timeout_seconds: 120
  max_retries: 3

# -------------------------------------------------------------------
# AGENT
# -------------------------------------------------------------------

agent:
  name: "urban-intelligence"

  system_prompt:
    file: "./ai/config/prompts/system.md"

  # Maximum number of model -> tool -> model iterations
  max_steps: 10

  # Prevent runaway loops
  max_execution_time_seconds: 180

  # What the agent is allowed to do
  capabilities:
    tool_calling: true
    retrieval: true
    memory: true
    planning: true

  # Require explicit structured output
  output:
    format: "json"
    schema: "./ai/config/schemas/agent_response.json"

# -------------------------------------------------------------------
# TOOLS
# -------------------------------------------------------------------

tools:

  # General tool execution
  execution:
    enabled: true
    parallel_calls: true
    timeout_seconds: 30
    max_calls_per_step: 5

  # Explicit allowlist is preferable to giving the agent everything.
  enabled:
    - "search_incidents"
    - "get_incident"
    - "query_gis"
    - "get_weather"
    - "search_infrastructure"

  permissions:

    search_incidents:
      enabled: true
      read_only: true

    get_incident:
      enabled: true
      read_only: true

    query_gis:
      enabled: true
      read_only: true

    get_weather:
      enabled: true
      read_only: true

    search_infrastructure:
      enabled: true
      read_only: true

  # Tools that can modify external state should be explicitly separated.
  write_operations:
    enabled: false
    require_confirmation: true

# -------------------------------------------------------------------
# MCP
# -------------------------------------------------------------------

mcp:

  enabled: true

  servers:

    gis:
      enabled: true
      transport: "stdio"
      command: "node"
      args: []

      tools:
        allow:
          - "query_map"
          - "search_features"

    incidents:
      enabled: true
      transport: "http"
      url: "${MCP_INCIDENTS_URL}"

      tools:
        allow:
          - "search_incidents"
          - "get_incident"

  security:
    allow_remote_servers: false
    require_authentication: true

# -------------------------------------------------------------------
# RAG / RETRIEVAL
# -------------------------------------------------------------------

retrieval:

  enabled: true

  provider: "vector_db"

  # Embedding configuration
  embeddings:
    provider: "openai"
    model: "text-embedding-3-small"
    dimensions: 1536

  search:
    top_k: 8
    similarity_threshold: 0.70

  reranking:
    enabled: true
    top_k: 5

  # What information can be retrieved
  sources:

    incidents:
      enabled: true
      collection: "incidents"

    infrastructure:
      enabled: true
      collection: "infrastructure"

    documentation:
      enabled: true
      collection: "documentation"

  context:
    max_tokens: 12000
    include_metadata: true
    include_source_references: true

# -------------------------------------------------------------------
# MEMORY
# -------------------------------------------------------------------

memory:

  enabled: true

  # Short-term conversation state
  conversation:
    enabled: true
    max_messages: 50
    max_tokens: 16000

  # Persistent semantic memory
  long_term:
    enabled: false
    provider: "vector_db"
    collection: "agent_memory"

  # Memory retrieval
  retrieval:
    top_k: 5
    similarity_threshold: 0.75

  # Important for privacy/security
  retention:
    enabled: true
    days: 30

# -------------------------------------------------------------------
# CONTEXT MANAGEMENT
# -------------------------------------------------------------------

context:

  max_tokens: 32000

  sources:
    conversation: true
    retrieval: true
    memory: true
    tool_results: true

  prioritization:
    system_prompt: 1.0
    current_user_request: 1.0
    tool_results: 0.9
    retrieved_documents: 0.8
    memory: 0.6

  compression:
    enabled: true
    trigger_at_percent: 85

# -------------------------------------------------------------------
# SAFETY / GUARDRAILS
# -------------------------------------------------------------------

safety:

  enabled: true

  input:
    validation: true
    max_length: 20000

  output:
    validation: true

  tools:
    require_confirmation_for:
      - "write_operations"
      - "external_actions"

  prompt_injection:
    detection: true

# -------------------------------------------------------------------
# OBSERVABILITY
# -------------------------------------------------------------------

observability:

  enabled: true

  logging:
    level: "INFO"

    # NEVER log secrets or raw sensitive data.
    redact_secrets: true
    redact_pii: true

    include:
      request_id: true
      model: true
      latency: true
      token_usage: true
      tool_calls: true
      retrieval: true
      errors: true

  tracing:
    enabled: true
    provider: "opentelemetry"

  metrics:
    enabled: true

    collect:
      - request_count
      - request_latency
      - model_latency
      - input_tokens
      - output_tokens
      - tool_calls
      - retrieval_latency
      - retrieval_hit_rate
      - errors
      - agent_steps

  evaluation:
    enabled: true

    sample_rate: 0.1

# -------------------------------------------------------------------
# COST CONTROL
# -------------------------------------------------------------------

cost:

  enabled: true

  limits:
    max_tokens_per_request: 20000
    max_tool_calls_per_request: 30

  budgets:
    daily_usd: 25
    monthly_usd: 500

# -------------------------------------------------------------------
# CACHING
# -------------------------------------------------------------------

cache:

  enabled: true

  provider: "redis"

  ttl_seconds: 300

  # Cache deterministic / expensive operations,
  # not arbitrary agent responses.
  operations:
    retrieval: true
    embeddings: true
    tool_results: true
    model_responses: false

# -------------------------------------------------------------------
# DATABASE
# -------------------------------------------------------------------

database:

  provider: "postgres"

  url: "${DATABASE_URL}"

  pool:
    min: 2
    max: 20

# -------------------------------------------------------------------
# EXTERNAL SERVICES
# -------------------------------------------------------------------

services:

  weather:
    url: "${WEATHER_API_URL}"
    api_key: "${WEATHER_API_KEY}"

  gis:
    url: "${GIS_API_URL}"
    api_key: "${GIS_API_KEY}"

# -------------------------------------------------------------------
# SECURITY
# -------------------------------------------------------------------

security:

  secrets:
    provider: "environment"

  network:
    allow_outbound: true

  authentication:
    enabled: true

  authorization:
    enabled: true

# -------------------------------------------------------------------
# DEVELOPMENT
# -------------------------------------------------------------------

development:

  debug: true

  mock_tools: false

  mock_model: false

  save_prompts: true
  save_tool_inputs: true
  save_tool_outputs: true

  # Useful while developing, dangerous in production.
  verbose_errors: true

# -------------------------------------------------------------------
# PRODUCTION
# -------------------------------------------------------------------

production:

  debug: false

  mock_tools: false
  mock_model: false

  save_prompts: false
  save_tool_inputs: false
  save_tool_outputs: false

  verbose_errors: false

  health_checks:
    enabled: true

  graceful_shutdown:
    timeout_seconds: 30
